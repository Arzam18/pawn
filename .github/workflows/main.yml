name: Build Pawn for Android ARM64

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android-arm64:
    name: Pawn Android ARM64 (NEON)
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y make file binutils

      - name: Install Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27d
          link-to-sdk: true

      - name: Configure Android toolchain
        shell: bash
        run: |
          set -euxo pipefail

          echo "ANDROID_NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"
          echo "$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin" >> "$GITHUB_PATH"

      - name: Build optimized ARM64 engine
        shell: bash
        run: |
          set -euxo pipefail

          export TARGET=aarch64-linux-android24
          export CC="${TARGET}-clang"
          export CXX="${TARGET}-clang++"

          make clean || true

          make -j"$(nproc)" \
            ARCH=armv8-a+simd \
            CC="$CC" \
            CXX="$CXX -static-libstdc++" \
            BUILD_DIR=build

          test -f build/pawn
          chmod +x build/pawn

      - name: Verify Android ARM64 binary
        shell: bash
        run: |
          set -euxo pipefail

          test -f build/pawn
          test -x build/pawn

          file build/pawn
          llvm-readelf -h build/pawn
          llvm-readelf -d build/pawn || true

          llvm-readelf -h build/pawn | grep -q 'AArch64'

          echo "Android ARM64 binary verified."
          echo "UCI runtime testing must be performed on Android."

      - name: Package Android ARM64 binary
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p dist
          cp build/pawn dist/pawn-android-arm64

          if [ -f LICENSE ]; then
            cp LICENSE dist/LICENSE
          fi

          sha256sum dist/pawn-android-arm64 > dist/SHA256SUMS.txt

      - name: Upload engine
        uses: actions/upload-artifact@v4
        with:
          name: Pawn-Android-ARM64-NEON
          path: dist/
          if-no-files-found: error
          retention-days: 30
