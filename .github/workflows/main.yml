name: Pawn Android Build

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-android:
    name: Build Pawn for Android (ARM64)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r26b

      - name: Ensure NNUE Network File Exists
        run: |
          # Automatically detects the network filename from NNUE.hpp and creates a placeholder if missing
          NET_FILE=$(grep NNUE_Default_File src/NNUE.hpp | cut -d'"' -f2)
          if [ ! -f "src/$NET_FILE" ]; then
            touch "src/$NET_FILE"
            echo "Created placeholder for src/$NET_FILE"
          fi

      - name: Build Pawn for Android ARM64
        run: |
          TOOLCHAIN=${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin
          make \
            CC=$TOOLCHAIN/aarch64-linux-android29-clang \
            CXX=$TOOLCHAIN/aarch64-linux-android29-clang++ \
            ARCH=armv8-a

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Pawn-Android-arm64
          path: build/pawn
          retention-days: 7
